        desc: "Bazându-ne pe experiența acumulată în anii de activitate, putem spune cu încredere ca putem oferi soluții și pentru probleme mecanice complexe, de la partea de constatare, până la soluționare."
        icon: fas fa-solid fa-wrench
      - title: "Reparații electrice"
        desc: "Asigurăm servicii pe tot ține de electronica autovehiculului dvs, de la cele mai mici până la cele mai complexe probleme."
        icon: fas fa-solid fa-charging-station
      - title: "Servicii de retrofit"
        desc: "Vreți să dați un aer de nou mașinii? La EMart vă oferim posibilitatea de upgrade pentru partea de infotaiment / faruri - stopuri / senzorică a mașinii dvs."
        icon: fas fa-solid fa-circle-up
      - title: "Tuning"
        desc: "Pentru a revitaliza performanțele mașinii, vă oferim și servicii de upgrade software, ce vor îmbunătăți dinamica acesteia, și vor face ca experiența la volan să fie una mult mai placută!"
        icon: fas fa-duotone fa-regular fa-laptop

