      - title: "Diagnoză auto"
        desc: "Folosind echipamente de ultimă generație, oferim servicii de diagnoză pentru autovehiculul dvs."
        icon: fas fa-solid fa-network-wired
      - title: "Servicii de mentenanță"
        desc: "Ne ocupăm de tot ce ține de partea de lucrări de mentenanță, schimb de filtre, ulei, placuțe/discuri de frână, etc, cu promptitudine și profesionalism!"
        icon: fas fa-solid fa-car
      # - title: "[Markdown](https://en.wikipedia.org/wiki/Markdown)"
